# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Reconfiguração de keymap: o caso rebinda um chord e o usa. Exercita o caminho em que a config do usuário substitui um binding default, e mostra no dump que o chord antigo continua ligado ao que estava — só o novo muda de ação."
open = "notas.txt"

[config]
keys = { "ctrl+p" = "move_doc_end", "f9" = "select_all" }

[[files]]
path = "notas.txt"
content = "abc\n"

[[steps]]
kind = "chord"
chord = "ctrl+p"

[[steps]]
kind = "text"
text = "!"

[[steps]]
kind = "chord"
chord = "f9"

[[steps]]
kind = "action"
action = "move_doc_start"
