# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Motor de busca no buffer: literal, com dobra de acentos, fronteira de palavra e regex. O passo `search` existe porque um driver scriptado não digita dentro de um overlay — e o que importa comparar são os offsets em bytes e a contagem de ocorrências, não a sobreposição visual. O caso do padrão inválido vive em regex-error.toml, porque o texto do diagnóstico difere entre os dois motores."
open = "texto.txt"

[[files]]
path = "texto.txt"
content = "ação e acao\nGUI UI UIKit use UI.\nvalor = 42 e total = 7\nArvore arvore Árvore\n"

[[steps]]
kind = "search"
query = "acao"
ignore_accents = true

[[steps]]
kind = "search"
query = "acao"
ignore_accents = false

[[steps]]
kind = "search"
query = "UI"
case_sensitive = true
whole_word = true

[[steps]]
kind = "search"
query = "UI"
case_sensitive = true
whole_word = false

[[steps]]
kind = "search"
query = "\\d+"
use_regex = true

[[steps]]
kind = "search"
query = "Árvore"
case_sensitive = true
ignore_accents = true

[[steps]]
kind = "search"
query = ""
