# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Edição sobre texto multi-byte: acentos, ideogramas e emoji. Exercita a conversão byte↔rune↔caret em digitação, movimento por chord (setas), backspace e undo. Qualquer erro de índice aparece no caret ou no texto."
open = "unicode.txt"

[[files]]
path = "unicode.txt"
content = "ção\n日本語\n🙂fim\n"

[[steps]]
kind = "chord"
chord = "ctrl+end"

[[steps]]
kind = "text"
text = "ç"

[[steps]]
kind = "chord"
chord = "left"

[[steps]]
kind = "chord"
chord = "left"

[[steps]]
kind = "text"
text = "X"

[[steps]]
kind = "chord"
chord = "backspace"

[[steps]]
kind = "chord"
chord = "ctrl+home"

[[steps]]
kind = "chord"
chord = "down"

[[steps]]
kind = "chord"
chord = "end"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "undo"

[divergence]
ledger = "B2"
note = "O oráculo clampa o caret ao estado atual; o Go o devolve a onde a edição desfeita aconteceu. O texto e as contagens batem."
