# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Seleção estendida por chords (shift+setas, shift+home/end), substituição da seleção pela digitação e undo. Exercita anchor/head orientados e o caminho em que digitar apaga a seleção antes de inserir."
open = "notas.txt"

[[files]]
path = "notas.txt"
content = "primeira linha\nsegunda linha\nterceira linha\n"

[[steps]]
kind = "chord"
chord = "ctrl+home"

[[steps]]
kind = "chord"
chord = "shift+right"

[[steps]]
kind = "chord"
chord = "shift+right"

[[steps]]
kind = "chord"
chord = "shift+right"

[[steps]]
kind = "text"
text = "XYZ"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "chord"
chord = "shift+end"

[[steps]]
kind = "chord"
chord = "shift+down"

[[steps]]
kind = "chord"
chord = "delete"

[[steps]]
kind = "action"
action = "select_all"

[[steps]]
kind = "action"
action = "undo"

[divergence]
ledger = "B3, B2"
note = "B3: o Go restaura a seleção que a edição substituiu; o oráculo a colapsa num caret. B2: o undo devolve o caret ao ponto da edição em vez de clampá-lo."
