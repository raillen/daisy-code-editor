# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Guarda o boundary de undo no Enter (ledger B1, corrigido) e a restauração de seleção (ledger B2, onde o Go diverge de propósito). Passos 5-6: undo remove só xyz (27→24) e depois abc+Enter (24→20) — Enter fecha o grupo. Passo 7: o redo volta a 24 bytes; o oráculo deixa o caret em (2,0), o Go o coloca onde a edição o deixou (3,0)."
open = "notas.txt"

[[files]]
path = "notas.txt"
content = "linha um\nlinha dois\n"

[[steps]]
kind = "action"
action = "move_doc_end"

[[steps]]
kind = "text"
text = "abc"

[[steps]]
kind = "action"
action = "insert_newline"

[[steps]]
kind = "text"
text = "xyz"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "redo"

[[steps]]
kind = "action"
action = "undo"

[divergence]
ledger = "B2"
note = "O oráculo clampa o caret ao tamanho do buffer; o Go restaura a seleção gravada no grupo de undo, que é onde a edição terminou."
