# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Controle do ledger B1 — movimento É fronteira de undo: digitar, mover e digitar produz dois grupos, e um undo remove apenas o que veio depois do movimento. O texto resultante é idêntico nos dois lados; o caret diverge pelo ledger B2."
open = "notas.txt"

[[files]]
path = "notas.txt"
content = "alpha\n"

[[steps]]
kind = "action"
action = "move_doc_end"

[[steps]]
kind = "text"
text = "AAA"

[[steps]]
kind = "action"
action = "move_left"

[[steps]]
kind = "action"
action = "move_left"

[[steps]]
kind = "text"
text = "BBB"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "undo"

[divergence]
ledger = "B2"
note = "Após o undo o oráculo clampa o caret para o fim do texto reduzido; o Go o devolve a onde o usuário estava antes da digitação desfeita."
