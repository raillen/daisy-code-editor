# Caso de paridade TS↔Rust. Formato TOML: tabelas para config/divergence, [[files]] e [[steps]] em ordem.
description = "Multi-cursor: dois cursores adicionados por ação, digitação em todos, backspace em todos e undo. Exercita a ordenação dos cursores, a aplicação de edições do maior offset para o menor e o recálculo dos offsets após cada remoção."
open = "tres.txt"

[[files]]
path = "tres.txt"
content = "um\ndois\ntres\n"

[[steps]]
kind = "action"
action = "move_doc_end"

[[steps]]
kind = "action"
action = "add_cursor_above"

[[steps]]
kind = "action"
action = "add_cursor_above"

[[steps]]
kind = "text"
text = "!"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "backspace"

[[steps]]
kind = "action"
action = "undo"

[[steps]]
kind = "action"
action = "clear_extra_cursors"

[[steps]]
kind = "action"
action = "move_down"

[divergence]
ledger = "B4, B2"
note = "B4: após o undo o oráculo mantém cursores além do fim do buffer e o backspace seguinte não altera o texto; o Go os descarta e a edição funciona. B2: o caret restaurado difere."
