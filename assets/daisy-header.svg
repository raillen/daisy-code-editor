<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340">
  <defs>
    <!-- CRT scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32" />
    </pattern>
    <linearGradient id="win98title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0025c5" />
      <stop offset="60%" stop-color="#001880" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <linearGradient id="glitchGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe500" />
      <stop offset="100%" stop-color="#67f4ed" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace; }
    .title-text { font-family: 'MS Sans Serif', Tahoma, 'Segoe UI', monospace; font-size: 13px; font-weight: bold; fill: #ffffff; letter-spacing: 0.5px; }
    .ascii-logo { font-size: 13px; font-weight: bold; fill: #ffe500; }
    .subtext { font-size: 12px; fill: #67f4ed; letter-spacing: 1px; }
    .status-text { font-size: 11px; fill: #f8f7eb; font-weight: bold; }
    .dim { fill: #8892b0; }
  </style>

  <!-- Outer Window Shadow -->
  <rect x="8" y="8" width="904" height="324" fill="#030408" opacity="0.9" />

  <!-- Outer Window Frame (Beveled Retro Border) -->
  <rect x="4" y="4" width="904" height="324" fill="#141824" stroke="#ffe500" stroke-width="2" />
  <line x1="4" y1="4" x2="908" y2="4" stroke="#ffe500" stroke-width="2" />
  <line x1="4" y1="4" x2="4" y2="328" stroke="#ffe500" stroke-width="2" />
  <line x1="908" y1="4" x2="908" y2="328" stroke="#0025c5" stroke-width="2" />
  <line x1="4" y1="328" x2="908" y2="328" stroke="#0025c5" stroke-width="2" />

  <!-- Title Bar -->
  <rect x="7" y="7" width="898" height="26" fill="url(#win98title)" />
  
  <!-- Retro Floppy / App Icon in Title Bar -->
  <g transform="translate(14, 10)">
    <rect x="0" y="0" width="18" height="18" fill="#ffe500" />
    <rect x="2" y="2" width="14" height="7" fill="#070913" />
    <rect x="4" y="3" width="5" height="5" fill="#67f4ed" />
    <rect x="3" y="11" width="12" height="6" fill="#f8f7eb" />
    <rect x="5" y="12" width="8" height="2" fill="#0025c5" />
  </g>

  <!-- Title Bar Text -->
  <text x="38" y="24" class="title-text mono">C:\DAISY\DAISY.EXE - [ The Wired Terminal IDE // v0.2.0 ]</text>

  <!-- Win98 Window Buttons (_ , 口 , X) -->
  <!-- Minimize Button -->
  <g transform="translate(828, 10)">
    <rect x="0" y="0" width="20" height="18" fill="#c0c0c0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="18" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <line x1="20" y1="0" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <rect x="4" y="12" width="10" height="3" fill="#000000" />
  </g>

  <!-- Maximize Button -->
  <g transform="translate(852, 10)">
    <rect x="0" y="0" width="20" height="18" fill="#c0c0c0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="18" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <line x1="20" y1="0" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <rect x="4" y="4" width="12" height="10" fill="none" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Close Button -->
  <g transform="translate(876, 10)">
    <rect x="0" y="0" width="20" height="18" fill="#c0c0c0" stroke="#ffffff" stroke-width="1" />
    <line x1="0" y1="18" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <line x1="20" y1="0" x2="20" y2="18" stroke="#404040" stroke-width="1.5" />
    <path d="M 5,4 L 14,13 M 14,4 L 5,13" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Window Interior / CRT Screen -->
  <rect x="8" y="34" width="896" height="264" fill="#070913" />
  <!-- Wireframe Grid Lines -->
  <line x1="8" y1="80" x2="904" y2="80" stroke="#0025c5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="8" y1="140" x2="904" y2="140" stroke="#0025c5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="8" y1="200" x2="904" y2="200" stroke="#0025c5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="8" y1="260" x2="904" y2="260" stroke="#0025c5" stroke-dasharray="3,3" opacity="0.4" />
  <line x1="460" y1="34" x2="460" y2="298" stroke="#0025c5" stroke-dasharray="3,3" opacity="0.3" />

  <!-- CRT Scanlines Overlay -->
  <rect x="8" y="34" width="896" height="264" fill="url(#scanlines)" pointer-events="none" />

  <!-- Content: Left Column (ASCII Logo & Tagline) -->
  <g transform="translate(28, 56)">
    <text x="0" y="16" class="subtext mono">SYS.BOOT // PROTOCOL: OPENTUI.SOLID // 1998-2026</text>
    
    <!-- ASCII Art Logo for DAISY -->
    <text x="0" y="42" class="ascii-logo mono"> ____       _             ____          _       </text>
    <text x="0" y="58" class="ascii-logo mono">|  _ \  __ _(_)___ _   _  / ___|___   __| | ___  </text>
    <text x="0" y="74" class="ascii-logo mono">| | | |/ _` | / __| | | || |   / _ \ / _` |/ _ \ </text>
    <text x="0" y="90" class="ascii-logo mono">| |_| | (_| | \__ \ |_| || |__| (_) | (_| |  __/ </text>
    <text x="0" y="106" class="ascii-logo mono">|____/ \__,_|_|___/\__, (_)____\___/ \__,_|\___| </text>
    <text x="0" y="122" class="ascii-logo mono">                   |___/        E D I T O R      </text>

    <text x="0" y="152" class="mono" font-size="13" fill="#f8f7eb" font-weight="bold">
      BRUTALIST NEON TERMINAL IDE FOR HIGH-SPEED DEVELOPMENT
    </text>
    <text x="0" y="174" class="mono" font-size="12" fill="#67f4ed">
      &gt;&gt; POWERED BY SOLIDJS REACTIVITY + BUN ENGINE // ZERO ELECTRON BLOAT
    </text>
    <text x="0" y="196" class="mono" font-size="12" fill="#ffe500">
      &gt;&gt; DUAL-MODE CUA + VIM KEYBOARDS // FULL LSP // EMBEDDED PTY // GIT SCM
    </text>
  </g>

  <!-- Content: Right Column (Cyberpunk HUD Specs Box) -->
  <g transform="translate(560, 52)">
    <!-- HUD Box Frame -->
    <rect x="0" y="0" width="320" height="232" fill="#020d58" fill-opacity="0.6" stroke="#67f4ed" stroke-width="1.5" />
    <rect x="4" y="4" width="312" height="22" fill="#0025c5" />
    <text x="12" y="19" class="mono" font-size="11" font-weight="bold" fill="#ffe500">SYSTEM SPECIFICATIONS [CONNECTED]</text>

    <!-- Spec rows -->
    <text x="14" y="48" class="mono" font-size="11" fill="#67f4ed">KERNEL RUNTIME:</text>
    <text x="160" y="48" class="mono" font-size="11" fill="#f8f7eb" font-weight="bold">Bun 1.2+ (Linux/macOS)</text>

    <text x="14" y="72" class="mono" font-size="11" fill="#67f4ed">RENDER ENGINE:</text>
    <text x="160" y="72" class="mono" font-size="11" fill="#f8f7eb" font-weight="bold">OpenTUI Solid (ASCII)</text>

    <text x="14" y="96" class="mono" font-size="11" fill="#67f4ed">STARTUP LATENCY:</text>
    <text x="160" y="96" class="mono" font-size="11" fill="#ffe500" font-weight="bold">&lt; 38 ms [COLD BOOT]</text>

    <text x="14" y="120" class="mono" font-size="11" fill="#67f4ed">FRAME TARGET:</text>
    <text x="160" y="120" class="mono" font-size="11" fill="#67f4ed" font-weight="bold">60 FPS [ZERO FLICKER]</text>

    <text x="14" y="144" class="mono" font-size="11" fill="#67f4ed">INTELLIGENCE:</text>
    <text x="160" y="144" class="mono" font-size="11" fill="#f8f7eb">LSP Client ($PATH)</text>

    <text x="14" y="168" class="mono" font-size="11" fill="#67f4ed">TERMINAL PTY:</text>
    <text x="160" y="168" class="mono" font-size="11" fill="#f8f7eb">POSIX VT100 / XTerm</text>

    <text x="14" y="192" class="mono" font-size="11" fill="#67f4ed">THEME SUITE:</text>
    <text x="160" y="192" class="mono" font-size="11" fill="#ffe500" font-weight="bold">Lain HUD / The Wired</text>

    <text x="14" y="216" class="mono" font-size="11" fill="#67f4ed">SECURITY PROFILE:</text>
    <text x="160" y="216" class="mono" font-size="11" fill="#3fb950" font-weight="bold">FAIL-CLOSED [0 CRASH]</text>
  </g>

  <!-- Status Bar (Win98 / Beveled Retro Style) -->
  <rect x="7" y="300" width="898" height="24" fill="#0c1020" />
  <line x1="7" y1="300" x2="905" y2="300" stroke="#0025c5" stroke-width="1.5" />

  <!-- Status Panels -->
  <!-- Panel 1: Ready -->
  <rect x="12" y="303" width="130" height="18" fill="#141824" stroke="#404860" stroke-width="1" />
  <text x="22" y="316" class="status-text mono" fill="#3fb950">● ONLINE [WIRED]</text>

  <!-- Panel 2: Memory -->
  <rect x="148" y="303" width="160" height="18" fill="#141824" stroke="#404860" stroke-width="1" />
  <text x="156" y="316" class="status-text mono" fill="#67f4ed">CONVENTIONAL: 640K</text>

  <!-- Panel 3: Mode -->
  <rect x="314" y="303" width="180" height="18" fill="#141824" stroke="#404860" stroke-width="1" />
  <text x="322" y="316" class="status-text mono" fill="#ffe500">MODE: CUA + VIM [HYBRID]</text>

  <!-- Panel 4: Version -->
  <rect x="500" y="303" width="180" height="18" fill="#141824" stroke="#404860" stroke-width="1" />
  <text x="508" y="316" class="status-text mono" fill="#f8f7eb">BUILD: v0.2.0-STABLE</text>

  <!-- Panel 5: Encoding -->
  <rect x="686" y="303" width="214" height="18" fill="#141824" stroke="#404860" stroke-width="1" />
  <text x="696" y="316" class="status-text mono" fill="#67f4ed">UTF-8 // ANSI X3.64 // VT</text>
</svg>
